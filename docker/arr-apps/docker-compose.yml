services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/edumudu/services/medias/flaresolverr/config:/config
    ports:
      - '8191:8191'

  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      - flaresolverr
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/edumudu/services/medias/prowlarr/config:/config
    ports:
      - '9696:9696'

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /home/edumudu/services/medias/bazarr/appdata/config:/config
      - ~/storage/hd1/fake-nas/data:/data
    ports:
      - 6767:6767

  radarr:
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/edumudu/services/medias/radarr/appdata/config:/config
      - ~/storage/hd1/fake-nas/data:/data

    ports:
      - '7878:7878'

  sonarr:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=1000
      - PGID=1000
    volumes:
      - /home/edumudu/services/medias/sonarr/appdata/config:/config
      - ~/storage/hd1/fake-nas/data:/data
    ports:
      - '8989:8989'

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - TZ=America/Sao_Paulo
      - LOG_LEVEL=debug
      - PUID=1000
      - PGID=1000
    ports:
      - 5055:5055
    volumes:
      - /home/edumudu/services/medias/seerr/appdata/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped


